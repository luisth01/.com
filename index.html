<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba</title>
    <style>
        :root {
            --color-primary: #ff6f61; 
            --color-background: #f0f0f0; 
            --color-text: #333; 
            --color-glass: rgba(255, 255, 255, 0.2); 
            --color-shadow: rgba(0, 0, 0, 0.1); 
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: #1a1a1a; 
                --color-text: #f0f0f0; 
                --color-glass: rgba(0, 0, 0, 0.2); 
                --color-shadow: rgba(255, 255, 255, 0.1); 
            }
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('./gatos.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--color-text);
            transition: background-color 0.5s, color 0.5s;
        }

        .container {
            background: var(--color-glass);
            backdrop-filter: blur(10px); 
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px var(--color-shadow);
            text-align: center;
            max-width: 90%;
            width: 400px;
            margin: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            animation: fadeIn 1s ease-out; 
        }

        h1 {
            color: var(--color-primary);
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .cat-image {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid var(--color-primary);
            transition: transform 0.3s ease;
        }

        .cat-image:hover {
            transform: scale(1.05); 
        }

        .description {
            color: var(--color-text);
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .thank-you {
            color: var(--color-primary);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .payment-buttons {
            display: flex;
            justify-content: center;
            gap: 10px; 
        }

        .payment-button {
            background-color: transparent; 
            border: none;
            padding: 10px;
            border-radius: 50%; 
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .payment-button img {
            width: 40px; 
            height: 40px;
            border-radius: 15%; 
            transition: transform 0.3s ease;
        }

        .payment-button:hover {
            transform: translateY(-5px); 
        }

        .payment-button:hover img {
            transform: scale(1.1); 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }

            .description, .thank-you {
                font-size: 14px;
            }

            .payment-button img {
                width: 30px; 
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Esto es una prueba!</h1>
        <img src="./chamo.jpeg" alt="Foto de mi gatito negro" class="cat-image">
        <p class="description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum id harum laudantium porro impedit ut voluptas quibusdam dolor alias, deleniti ex voluptate dolorem cumque perspiciatis fugiat vero consequatur non. Facilis!
        </p>
        <p class="thank-you">¡Gracias por tu visita!</p>
        <div class="payment-buttons">
            <a href="https://www.paypal.me/Luisth05" target="_blank" class="payment-button">
                <img src="./paypal.png" alt="PayPal">
            </a>
            <a href="https://yape.com" target="_blank" class="payment-button">
                <img src="./yape.png" alt="Yape">
            </a>
            <a href="https://otrometododepago.com" target="_blank" class="payment-button">
                <img src="./binance.png" alt="Binance">
            </a>
            <a href="https://mobile.x.com/LuisTH054" target="_blank" class="payment-button">
                <img src="./X.png" alt="X">
            </a>
        </div>
    </div>
</body>
</html>
